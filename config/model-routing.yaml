{
  "schema_version": 1,
  "routing_version": "0.1.0",
  "updated": "2026-10-09",
  "notes": "Adaptive model routing V0.1. Three separated layers: task classification (MECHANICAL/NORMAL/CORRECTNESS_SENSITIVE/CRITICAL) -> symbolic routing requirement (tier FAST/BALANCED/STRONG/MAX + reasoning effort) -> model resolution (tier -> role in models/roles.yaml -> provider/model). Classification and escalation use no provider/model identifiers, so any provider or model can be added or replaced by configuration alone. Concrete provider/model names are never named here, no account quota and no secrets are stored, and V0.1 never switches a user-selected model automatically (every surface is RECOMMEND_ONLY). Surfaces may optionally restrict tiers; an unsupported tier is reported UNAVAILABLE_ON_SURFACE, never silently downgraded. This does not duplicate tool-baseline.yaml (tool versions), models/roles.yaml (role -> provider/model), or the escalation policy in config/runtime.yaml (failure-category eligibility).",
  "tiers": {
    "FAST": {"role": "student", "effort": "low"},
    "BALANCED": {"role": "student", "effort": "medium"},
    "STRONG": {"role": "teacher-cheap", "effort": "high"},
    "MAX": {"role": "teacher-premium", "effort": "max"}
  },
  "task_classes": {
    "MECHANICAL": {
      "tier": "FAST",
      "effort": "low",
      "max_retries": 1,
      "escalates_to": "NORMAL",
      "rationale": "bounded deterministic edit (search, rename, format, config key, rerun tests, git)"
    },
    "NORMAL": {
      "tier": "BALANCED",
      "effort": "medium",
      "max_retries": 1,
      "escalates_to": "CORRECTNESS_SENSITIVE",
      "rationale": "bounded implementation or bugfix with understood behavior"
    },
    "CORRECTNESS_SENSITIVE": {
      "tier": "STRONG",
      "effort": "high",
      "max_retries": 1,
      "escalates_to": "CRITICAL",
      "rationale": "ambiguity or correctness risk (architecture, concurrency, security, persistence, cross-machine)"
    },
    "CRITICAL": {
      "tier": "MAX",
      "effort": "max",
      "max_retries": 0,
      "escalates_to": null,
      "rationale": "unresolved correctness-sensitive or security-sensitive design"
    }
  },
  "effort_order": ["low", "medium", "high", "max"],
  "tier_order": ["FAST", "BALANCED", "STRONG", "MAX"],
  "surfaces": {
    "opencode": {"capability": "RECOMMEND_ONLY"},
    "codex-cli": {"capability": "RECOMMEND_ONLY"},
    "codex-vscode": {"capability": "RECOMMEND_ONLY"},
    "codex-desktop": {"capability": "RECOMMEND_ONLY"}
  }
}
