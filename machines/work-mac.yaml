{
  "schema_version": 1,
  "id": "work-mac",
  "platform": "macos",
  "os": "darwin",
  "shell": "zsh",
  "repo_path": "~/Developer/Back-End/ai-local-infra",
  "graph_root": "~/.local/share/local-ai-infra/graphify",
  "state_dir": "~/.local/state/local-ai-infra",
  "bin": {
    "oc": "~/.local/bin/oc"
  },
  "headroom": {
    "bin": "~/.local/bin/headroom",
    "lifecycle": "wrapper"
  },
  "graphify": {
    "graph_dir": "~/.local/share/local-ai-infra/graphify/local-ai-infra/graphify-out"
  },
  "lifecycle_capabilities": ["launchd"],
  "provider_availability": {
    "ollama": true,
    "deepseek": true,
    "codex": true
  },
  "feature": {
    "rtk_auto": true,
    "graphify_auto": true,
    "headroom_proxy": true
  }
}
